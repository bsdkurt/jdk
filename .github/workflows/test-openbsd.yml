name: 'Run tests in VM (OpenBSD)'

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      vm-release:
        required: true
        type: string
      vm-arch:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      debug-suffix:
        required: false
        type: string
      static-suffix:
        required: false
        type: string

env:
  MYTOKEN : ${{ secrets.MYTOKEN }}

jobs:
  test:
    name: test
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        test-name:
          - 'langtools/tier1.all.off'

        include:
          - test-name: 'langtools/tier1.all.off'
            test-suite: 'test/langtools/:tier1'
            cpu-features: '%20-XX:+UnlockDiagnosticVMOptions%20-XX:-UseBMI1Instructions%20-XX:-UseBMI2Instructions%20-XX:UseAVX=0%20-XX:X86ICacheSync=1%20-XX:-UseCountLeadingZerosInstruction%20-XX:-UseSHA%20-XX:-UseGFNI%20-XX:-UseFastStosb'

    steps:
      - name: Setup Host for VM
        run: |
          echo "Starting storage:"
          sudo df -h
          echo "Removing Android SDKs and Tools"
          sudo rm -rf /usr/local/lib/android
          echo "Reduce swappiness"
          sudo sysctl vm.swappiness=10
          echo "Available storage:"
          sudo df -h

      - name: 'Checkout the JDK source'
        uses: actions/checkout@v6

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: openbsd-x64

      - name: 'Get JTReg'
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: 'Get bundles'
        id: bundles
        uses: ./.github/actions/get-bundles
        with:
          platform: ${{ inputs.platform }}
          debug-suffix: ${{ matrix.debug-suffix }}
          static-suffix: ${{ inputs.static-suffix }}
        if: ${{ inputs.dry-run == false }}

      - name: 'Set PATH'
        id: path
        run: |
          echo "value=$PATH" >> $GITHUB_OUTPUT
          if [[ '${{ inputs.static-suffix }}' == '-static' ]]; then
            echo "static-hotspot-problemlist-path=`pwd`/test/hotspot/jtreg/ProblemList-StaticJdk.txt" >> $GITHUB_OUTPUT
            echo "static-jdk-problemlist-path=`pwd`/test/jdk/ProblemList-StaticJdk.txt" >> $GITHUB_OUTPUT
            echo "static-langtools-problemlist-path=`pwd`/test/langtools/ProblemList-StaticJdk.txt" >> $GITHUB_OUTPUT
            echo "static-lib-test-problemlist-path=`pwd`/test/lib-test/ProblemList-StaticJdk.txt" >> $GITHUB_OUTPUT
          fi

      - name: 'Set Extra Options'
        id: extra-options
        run: |
          if [[ '${{ inputs.static-suffix }}' == '-static' ]]; then
            echo "test-jdk=JDK_UNDER_TEST=${{ steps.bundles.outputs.static-jdk-path }}" >> $GITHUB_OUTPUT
            echo "compile-jdk=JDK_FOR_COMPILE=${{ steps.bundles.outputs.jdk-path }}" >> $GITHUB_OUTPUT
            echo "extra-problem-lists=EXTRA_PROBLEM_LISTS=${{ steps.path.outputs.static-hotspot-problemlist-path }}%20${{ steps.path.outputs.static-jdk-problemlist-path }}%20${{ steps.path.outputs.static-langtools-problemlist-path }}%20${{ steps.path.outputs.static-lib-test-problemlist-path }}" >> $GITHUB_OUTPUT
          fi

      - name: Restore Cached VM Packages
        id: vm-packages-cache
        uses: actions/cache/restore@v5
        with:
          path: obsd-pkg-cache
          key: packages-${{ inputs.platform }}-${{ inputs.vm-release }}-${{ inputs.vm-arch }}-${{ hashFiles('./obsd-pkg-cache/*.tgz') }}

      - name: 'Run Tests in OpenBSD VM'
        id: run-tests
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ inputs.vm-release }}
          arch: ${{ inputs.vm-arch }}
          mem: 12288
          cpu: 4
          envs: 'MYTOKEN'
          usesh: true
          debug-on-error: true
          prepare: |
            mount -u -o wxallowed /home
            usermod -L pbuild root
            export PKG_CACHE=$GITHUB_WORKSPACE/obsd-pkg-cache
            mkdir -p ${PKG_CACHE}
            export PKG_PATH="${PKG_CACHE}:https://cdn.openbsd.org/%m"
            until pkg_add gtar-- zip unzip-- cups-libs bash ggrep gmake dwz libiconv harfbuzz jpeg lcms2 png giflib gdb; do
              echo Retrying in 10 seconds; sleep 10;
            done
          run: >
            ulimit -Sd $(ulimit -Hd) &&
            while gmake test-prebuilt
            TEST='${{ matrix.test-suite }}'
            BOOT_JDK=${{ steps.bootjdk.outputs.path }}
            JT_HOME=${{ steps.jtreg.outputs.path }}
            JDK_IMAGE_DIR=${{ steps.bundles.outputs.jdk-path }}
            SYMBOLS_IMAGE_DIR=${{ steps.bundles.outputs.symbols-path }}
            TEST_IMAGE_DIR=${{ steps.bundles.outputs.tests-path }}
            ${{ steps.extra-options.outputs.test-jdk }}
            ${{ steps.extra-options.outputs.compile-jdk }}
            JTREG='JAVA_OPTIONS=-XX:-CreateCoredumpOnCrash${{ matrix.cpu-features }};VERBOSE=fail,error,time;KEYWORDS=!headful;${{ steps.extra-options.outputs.extra-problem-lists }}'
            ; do echo done; done
        if: ${{ inputs.dry-run == false }}

      - name: 'Check Memory, Swap and Disk Usage'
        run: |
          echo "Memory and swap:"
          sudo free -h
          echo
          echo "Available storage:"
          sudo df -h

        # This is a separate step, since if the markdown from a step gets bigger than
        # 1024 kB it is skipped, but then the short summary above is still generated
      - name: 'Generate test report'
        run: bash ./.github/scripts/gen-test-results.sh "$GITHUB_STEP_SUMMARY"
        if: always()

      - name: 'Package test results'
        id: package
        run: |
          # Package test-results and relevant parts of test-support
          mkdir results

          if [[ -d build/run-test-prebuilt/test-results ]]; then
            cd build/run-test-prebuilt/test-results/
            zip -r -9 "$GITHUB_WORKSPACE/results/test-results.zip" .
            cd $GITHUB_WORKSPACE
          else
            echo '::warning ::Missing test-results directory'
          fi

          if [[ -d build/run-test-prebuilt/test-support ]]; then
            cd build/run-test-prebuilt/test-support/
            zip -r -9 "$GITHUB_WORKSPACE/results/test-support.zip" . -i *.jtr -i */hs_err*.log -i */replay*.log
            cd $GITHUB_WORKSPACE
          else
            echo '::warning ::Missing test-support directory'
          fi

          artifact_name="results-${{ inputs.platform }}-$(echo ${{ matrix.test-name }}${{ inputs.static-suffix }} | tr '/ ' '__')"
          echo "artifact-name=$artifact_name" >> $GITHUB_OUTPUT
        if: always()

      - name: 'Upload test results'
        uses: actions/upload-artifact@v6
        with:
          path: results
          name: ${{ steps.package.outputs.artifact-name }}
        if: always()

        # This is the best way I found to abort the job with an error message
      - name: 'Notify about test failures'
        uses: actions/github-script@v8
        with:
          script: core.setFailed('${{ steps.run-tests.outputs.error-message }}')
        if: steps.run-tests.outputs.failure == 'true'
