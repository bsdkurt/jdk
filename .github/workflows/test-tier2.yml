name: 'Run tier2 tests'

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      bootjdk-platform:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      architecture:
        required: false
        type: string
      xcode-toolset-version:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      debug-suffix:
        required: false
        type: string
      static-suffix:
        required: false
        type: string

env:
  # These are needed to make the MSYS2 bash work properly
  MSYS2_PATH_TYPE: minimal
  CHERE_INVOKING: 1

jobs:
  test-tier2:
    name: test-tier2
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        test-name:
          - 'jdk/tier2 part 1'
          - 'jdk/tier2 part 2'
          - 'jdk/tier2 part 3'
          - 'langtools/tier2'
          - 'hs/tier2 runtime'
          - 'hs/tier2 runtime platform agnostic'
          - 'hs/tier2 serviceability'
          - 'hs/tier2 compiler'
          - 'hs/tier2 ctw'
          - 'hs/tier2 gc epsilon'
          - 'hs/tier2 gc shenandoah'

        include:
          - test-name: 'jdk/tier2 part 1'
            test-suite: 'test/jdk/:tier2_part1'

          - test-name: 'jdk/tier2 part 2'
            test-suite: 'test/jdk/:tier2_part2'

          - test-name: 'jdk/tier2 part 3'
            test-suite: 'test/jdk/:tier2_part3'

          - test-name: 'langtools/tier2'
            test-suite: 'test/langtools/:tier2'

          - test-name: 'hs/tier2 runtime'
            test-suite: 'test/hotspot/jtreg/:hotspot_tier2_runtime'
            debug-suffix: ${{ inputs.debug-suffix }}

          - test-name: 'hs/tier2 runtime platform agnostic'
            test-suite: 'test/hotspot/jtreg/:hotspot_tier2_runtime_platform_agnostic'
            debug-suffix: ${{ inputs.debug-suffix }}

          - test-name: 'hs/tier2 serviceability'
            test-suite: 'test/hotspot/jtreg/:hotspot_tier2_serviceability'
            debug-suffix: ${{ inputs.debug-suffix }}

          - test-name: 'hs/tier2 compiler'
            test-suite: 'test/hotspot/jtreg/:tier2_compiler'
            debug-suffix: ${{ inputs.debug-suffix }}

          - test-name: 'hs/tier2 ctw'
            test-suite: 'test/hotspot/jtreg/:tier2_ctw'
            debug-suffix: ${{ inputs.debug-suffix }}

          - test-name: 'hs/tier2 gc epsilon'
            test-suite: 'test/hotspot/jtreg/:tier2_gc_epsilon'
            debug-suffix: ${{ inputs.debug-suffix }}

          - test-name: 'hs/tier2 gc shenandoah'
            test-suite: 'test/hotspot/jtreg/:tier2_gc_shenandoah'
            debug-suffix: ${{ inputs.debug-suffix }}

    steps:
      - name: 'Do Tests'
        id: do-tests
        uses: ./.github/actions/do-test
        with:
          test-suite: '${{ matrix.test-suite }}'
          test-name: '${{ matrix.test-name }}'
          platform: ${{ inputs.platform }}
          bootjdk-platform: ${{ inputs.bootjdk-platform }}
          architecture: ${{ inputs.architecture }}
          xcode-toolset-version: ${{ inputs.xcode-toolset-version }}
          dry-run: ${{ inputs.dry-run }}
          debug-suffix: ${{ matrix.debug-suffix }}
          static-suffix: ${{ inputs.static-suffix }}
